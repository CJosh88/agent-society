services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: asl
      POSTGRES_USER: asl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asl -d asl"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ../api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/asl
      SPRING_DATASOURCE_USERNAME: asl
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      ASL_ADMIN_KEY: ${ASL_ADMIN_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
