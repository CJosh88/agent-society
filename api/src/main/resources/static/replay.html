<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay · Agent Society Lab</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <p><a href="/">← All worlds</a></p>
  <h1 id="title">Replay</h1>
  <p class="lede" id="subtitle"></p>
</header>
<main>
  <div id="status" aria-live="polite">Loading…</div>
  <div id="replay" class="replay" hidden>
    <div>
      <div id="game" aria-label="Picture of the world: the 24 tickets with the share of HIGH ratings so far, and the line of agents. The panel on the right has the same information as text."></div>
      <div class="controls">
        <button type="button" id="play" disabled>Play</button>
        <span role="group" aria-label="Speed">
          <button type="button" class="speed active" data-speed="1">1×</button>
          <button type="button" class="speed" data-speed="4">4×</button>
          <button type="button" class="speed" data-speed="16">16×</button>
        </span>
        <input type="range" id="slider" min="0" max="200" value="0" step="1" aria-label="Agent position" disabled>
        <output id="pos-label" for="slider">Agent 0 / 200</output>
      </div>
      <p class="summary" id="summary"></p>
    </div>
    <aside>
      <div class="toggles">
        <label><input type="checkbox" id="thoughts" checked> Show thoughts</label>
        <label><input type="checkbox" id="reveal"> Reveal truth</label>
      </div>
      <div class="legend" id="legend"></div>
      <h2 id="agent-title">Agent</h2>
      <div class="person" id="agent-card"></div>
      <h2 id="ticket-title">Ticket</h2>
      <p id="ticket-text" class="ticket-text">Click a ticket on the board to read it.</p>
      <h2 id="log-title">This agent</h2>
      <ul id="log" aria-live="polite"></ul>
      <div class="probe" id="probe" hidden></div>
    </aside>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="js/replay.js"></script>
</body>
</html>
