<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Replay · Agent Society Lab</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<header>
  <p><a href="/">← All runs</a></p>
  <h1 id="title">Replay</h1>
  <p class="lede" id="subtitle"></p>
</header>
<main>
  <div id="status" aria-live="polite">Loading…</div>
  <div id="replay" class="replay" hidden>
    <div>
      <div id="game" aria-label="Map of the scene. The event log on the right has the same information as text."></div>
      <div class="controls">
        <button type="button" id="play" disabled>Play</button>
        <span role="group" aria-label="Speed">
          <button type="button" class="speed active" data-speed="1">1×</button>
          <button type="button" class="speed" data-speed="2">2×</button>
          <button type="button" class="speed" data-speed="4">4×</button>
        </span>
        <input type="range" id="slider" min="0" max="12" value="0" step="1" aria-label="Tick" disabled>
        <output id="tick-label" for="slider">Tick 0 / 12</output>
      </div>
      <p class="summary" id="summary"></p>
    </div>
    <aside>
      <div class="people" id="people"></div>
      <label><input type="checkbox" id="thoughts" checked> Show thoughts</label>
      <h2 id="log-title">Events</h2>
      <ul id="log" aria-live="polite"></ul>
      <div class="probe" id="probe" hidden></div>
    </aside>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<script type="module" src="js/replay.js"></script>
</body>
</html>
