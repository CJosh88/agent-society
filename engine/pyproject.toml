[project]
name = "asl-engine"
version = "0.1.0"
description = "Agent Society Lab engine: LangGraph runs posted to the Spring API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "langgraph",
  "langchain",
  "langchain-core",
  "langchain-anthropic",
  "langchain-openai",
  "pydantic>=2",
  "typer",
  "httpx",
  "tenacity",
  "scipy",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "jsonschema"]

[project.scripts]
asl = "asl_engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asl_engine"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
