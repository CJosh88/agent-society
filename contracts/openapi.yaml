openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost
  description: Generated server url
paths:
  /api/admin/runs:
    post:
      tags:
      - admin-ingest-controller
      operationId: post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunBundle"
        required: true
      responses:
        "201":
          description: Created
          content:
            '*/*':
              schema:
                type: object
                additionalProperties:
                  type: string
                  format: uuid
  /api/runs:
    get:
      tags:
      - run-controller
      operationId: list
      parameters:
      - name: scenario
        in: query
        required: false
        schema:
          type: string
      - name: population
        in: query
        required: false
        schema:
          type: string
      - name: condition
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PagedModelRunSummary"
  /api/runs/{id}:
    get:
      tags:
      - run-controller
      operationId: get
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RunDetail"
  /api/runs/{id}/events:
    get:
      tags:
      - run-controller
      operationId: events
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventView"
  /api/runs/featured:
    get:
      tags:
      - run-controller
      operationId: featured
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RunSummary"
  /api/results:
    get:
      tags:
      - results-controller
      operationId: get_1
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ResultsResponse"
components:
  schemas:
    AgentInfo:
      type: object
      properties:
        agent_id:
          type: string
          pattern: "a([1-9][0-9]?|1[0-9]{2}|200)"
        name:
          type: string
          minLength: 1
        role:
          type: string
          pattern: agent|scripted
        persona:
          type: object
          additionalProperties: {}
      required:
      - agent_id
      - name
      - persona
      - role
    EventInfo:
      type: object
      properties:
        seq:
          type: integer
          format: int32
          minimum: 0
        tick:
          type: integer
          format: int32
          maximum: 200
          minimum: 1
        type:
          type: string
          pattern: AGENT_SPAWNED|TICKETS_SHOWN|AGENT_PICKED|AGENT_RATED|ACTION_PARSE_FAILED|PROBE_ANSWERED|RUN_ENDED
        agent_id:
          type: string
          pattern: "a([1-9][0-9]?|1[0-9]{2}|200)"
        payload:
          type: object
          additionalProperties: {}
      required:
      - payload
      - seq
      - tick
      - type
    LlmCallInfo:
      type: object
      properties:
        agent_id:
          type: string
          pattern: "a([1-9][0-9]?|1[0-9]{2}|200)"
        tick:
          type: integer
          format: int32
          maximum: 200
          minimum: 1
        kind:
          type: string
          pattern: decision|probe
        attempt:
          type: integer
          format: int32
          maximum: 2
          minimum: 1
        prompt:
          type: string
        response_text:
          type: string
        reasoning_text:
          type: string
        finish_reason:
          type: string
        input_tokens:
          type: integer
          format: int32
          minimum: 0
        output_tokens:
          type: integer
          format: int32
          minimum: 0
        tokens_estimated:
          type: boolean
        parsed_ok:
          type: boolean
        latency_ms:
          type: integer
          format: int32
          minimum: 0
      required:
      - agent_id
      - attempt
      - kind
      - latency_ms
      - parsed_ok
      - prompt
      - response_text
      - tick
      - tokens_estimated
    RunBundle:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/RunInfo"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentInfo"
          minItems: 1
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventInfo"
          minItems: 1
        llm_calls:
          type: array
          items:
            $ref: "#/components/schemas/LlmCallInfo"
      required:
      - agents
      - events
      - llm_calls
      - run
    RunInfo:
      type: object
      properties:
        id:
          type: string
          format: uuid
        experiment:
          type: string
          pattern: cascade_v1
        scenario:
          type: string
          pattern: triage_cascade
        condition:
          type: string
          pattern: independent|weak|strong|seeded_wrong
        population:
          type: string
          pattern: "llama-3[.]1-8b|gpt-oss-120b|claude-haiku-5-5|mix_early|mix_late|fake"
        world_seed:
          type: integer
          format: int64
          minimum: 0
        prompt_version:
          type: string
          minLength: 1
        engine_version:
          type: string
          minLength: 1
        pilot:
          type: boolean
        started_at:
          type: string
          format: date-time
        ended_at:
          type: string
          format: date-time
      required:
      - condition
      - ended_at
      - engine_version
      - experiment
      - id
      - pilot
      - population
      - prompt_version
      - scenario
      - started_at
      - world_seed
    PageMetadata:
      type: object
      properties:
        size:
          type: integer
          format: int64
        number:
          type: integer
          format: int64
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int64
      required:
      - number
      - size
      - totalElements
      - totalPages
    PagedModelRunSummary:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/RunSummary"
        page:
          $ref: "#/components/schemas/PageMetadata"
      required:
      - content
      - page
    RunSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        scenario:
          type: string
        condition:
          type: string
        population:
          type: string
        worldSeed:
          type: integer
          format: int64
        pilot:
          type: boolean
        createdAt:
          type: string
          format: date-time
        accuracy:
          type: number
          format: double
        ratedCount:
          type: integer
          format: int32
        parseFailures:
          type: integer
          format: int32
        truncations:
          type: integer
          format: int32
        probeCount:
          type: integer
          format: int32
        recognisedSample:
          type: integer
          format: int32
    AgentView:
      type: object
      properties:
        agentId:
          type: string
        name:
          type: string
        role:
          type: string
        persona:
          type: object
          additionalProperties: {}
    RunDetail:
      type: object
      properties:
        run:
          $ref: "#/components/schemas/RunView"
        agents:
          type: array
          items:
            $ref: "#/components/schemas/AgentView"
    RunView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        experiment:
          type: string
        scenario:
          type: string
        condition:
          type: string
        population:
          type: string
        worldSeed:
          type: integer
          format: int64
        promptVersion:
          type: string
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        accuracy:
          type: number
          format: double
        ratedCount:
          type: integer
          format: int32
        probeCount:
          type: integer
          format: int32
        recognisedSample:
          type: integer
          format: int32
    EventView:
      type: object
      properties:
        seq:
          type: integer
          format: int32
        tick:
          type: integer
          format: int32
        type:
          type: string
        agentId:
          type: string
        payload:
          type: object
          additionalProperties: {}
    Difference:
      type: object
      properties:
        comparison:
          type: string
        diff:
          type: number
          format: double
        ciLow:
          type: number
          format: double
        ciHigh:
          type: number
          format: double
    PopulationResults:
      type: object
      properties:
        population:
          type: string
        rows:
          type: array
          items:
            $ref: "#/components/schemas/Row"
        differences:
          type: array
          items:
            $ref: "#/components/schemas/Difference"
    ResultsResponse:
      type: object
      properties:
        populations:
          type: array
          items:
            $ref: "#/components/schemas/PopulationResults"
        traceLinks:
          type: array
          items:
            type: string
    Row:
      type: object
      properties:
        condition:
          type: string
        "n":
          type: integer
          format: int32
        meanAccuracy:
          type: number
          format: double
        ciLow:
          type: number
          format: double
        ciHigh:
          type: number
          format: double
        parseFailureRate:
          type: number
          format: double
        truncationRate:
          type: number
          format: double
        recognitionRate:
          type: number
          format: double
